[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-clipper"
version = "0.1.0"
description = "Turn long-form YouTube videos into captioned vertical short-form clips and post them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "yt-dlp>=2024.1.1",
    "faster-whisper>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
facetrack = ["opencv-python-headless>=4.8"]
youtube = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
]
all = ["youtube-clipper[facetrack,youtube]"]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]
